# No host IPv6 stack or automatic IPv6 addresses, including on future ports.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1

# The guest forwards Ethernet frames through the bridge, not routed IP packets.
net.ipv4.ip_forward = 0

# Do not write core dumps through a distribution-provided core_pattern handler.
kernel.core_pattern = /dev/null
fs.suid_dumpable = 0
