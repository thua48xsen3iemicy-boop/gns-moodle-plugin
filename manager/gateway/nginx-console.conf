# Console gateway behind nginx in the manager's LXC (README §1.1). Put inside the public
# `server { listen 443 ssl; server_name <name of GATEWAY_PUBLIC_URL>; ... }` block.
# Only /console/ is published: /internal/tickets stays on 127.0.0.1 for the manager.

location /console/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The gateway pings every 25 s; idle consoles must outlive that.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # VNC screens (raw RFB in binary frames, tickets with console "vnc") use this same location: a screen is a long,
    # chatty stream, but once the connection is upgraded nginx just relays bytes both ways. The timeouts above are
    # per read/write and the gateway's pings (every 25 s) keep an idle screen well inside them. Nothing
    # to tune: no body size limit applies to WebSocket frames, and `proxy_buffering off` keeps the relay unbuffered.
    proxy_buffering off;
    # The one-time ticket is in the query string: keep it out of the access log.
    access_log off;
}

location / {
    return 404;
}
