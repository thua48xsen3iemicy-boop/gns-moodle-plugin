<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mod_gns3lab · UI harness</title>
<link rel="stylesheet" href="styles.css">
<style>
/* A little of Boost, so that the page looks like Moodle: the plugin takes its colours from these variables. */
:root{--bs-body-bg:#fff;--bs-body-color:#212529;--bs-secondary-bg:#e9ecef;--bs-tertiary-bg:#f8f9fa;--bs-border-color:#dee2e6;--bs-secondary-color:#6c757d;--bs-primary:#0f6cbf;--bs-success:#357a32;--bs-danger:#ca3120;--bs-body-font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--bs-font-monospace:SFMono-Regular,Menlo,Consolas,monospace}
:root[data-bs-theme="dark"]{color-scheme:dark;--bs-body-bg:#1a1d20;--bs-body-color:#dee2e6;--bs-secondary-bg:#2b3035;--bs-tertiary-bg:#212529;--bs-border-color:#495057;--bs-secondary-color:#adb5bd;--bs-primary:#6ea8fe;--bs-success:#75b798;--bs-danger:#ea868f}
body{margin:0;font-family:var(--bs-body-font-family);background:var(--bs-body-bg);color:var(--bs-body-color)}
body.gns3lab-fullscreen{overflow:hidden}
</style>
<script src="require.js"></script>
<script>
const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') document.documentElement.setAttribute('data-bs-theme', 'dark');
window.GNS3LAB_STUB = {lang: '{{lang}}', fast: q.has('fast'), norunning: q.has('norunning'), conflict: q.has('conflict'), observer: q.has('observer'), nofacts: q.has('nofacts'), factsempty: q.has('factsempty')};
requirejs.config({baseUrl: '.', paths: {mod_gns3lab: q.has('min') ? 'amd-min' : 'amd', core: 'stubs'}});
</script>
</head>
<body class="gns3lab-fullscreen">
{{body}}
<script>
require(['mod_gns3lab/lab'], function(lab) { lab.init('u1', 1, q.has('observer') ? 7 : 0); });
</script>
</body>
</html>
