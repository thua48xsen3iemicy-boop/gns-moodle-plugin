<title>Вьюер топологии GNS3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen tool — toolbar on top, pannable lab canvas, read-only info panel on the right (bottom sheet on phones) */
:root{
  --bg:#E8ECEF; --canvas:#F4F6F8; --panel:#FFFFFF; --fg:#16212B; --muted:#57656F;
  --line:#CAD2D9; --grid:#C9D2DA; --wire:#566878; --accent:#1F6FC5; --accent-ink:#FFFFFF;
  --ico:#2C4A63; --ico-glyph:#F4F6F8; --chip:#E4EAEF;
  --ok:#1E8E4F; --warn:#AD7F08; --bad:#C8423A;
  --c1:#2F6FD0; --c2:#1E8E4F; --c3:#B5730A; --c4:#8E44AD; --c5:#B83280; --c6:#0E7C86;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1418; --canvas:#121A20; --panel:#172129; --fg:#E2E8ED; --muted:#94A3AF;
    --line:#2A3742; --grid:#24313B; --wire:#8094A4; --accent:#5AA8F2; --accent-ink:#0E1418;
    --ico:#8AAFCC; --ico-glyph:#121A20; --chip:#21303A;
    --ok:#3CC47A; --warn:#E0B13A; --bad:#EE6B62; color-scheme:dark;
    --c1:#6AA6F5; --c2:#4CC98A; --c3:#E6B64A; --c4:#C08BE0; --c5:#E879B9; --c6:#4EC3CC;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1418; --canvas:#121A20; --panel:#172129; --fg:#E2E8ED; --muted:#94A3AF;
  --line:#2A3742; --grid:#24313B; --wire:#8094A4; --accent:#5AA8F2; --accent-ink:#0E1418;
  --ico:#8AAFCC; --ico-glyph:#121A20; --chip:#21303A;
  --ok:#3CC47A; --warn:#E0B13A; --bad:#EE6B62; color-scheme:dark;
  --c1:#6AA6F5; --c2:#4CC98A; --c3:#E6B64A; --c4:#C08BE0; --c5:#E879B9; --c6:#4EC3CC;
}
html,body{height:100%}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.ttl{min-width:0}
.ttl h1{margin:0;font:600 19px/1.2 var(--display);letter-spacing:.005em;text-wrap:balance}
.meta{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.src{font:500 11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ro{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px dashed var(--line);padding:5px 8px;border-radius:5px}
.btn{font:500 13px/1 var(--body);height:32px;padding:0 12px;border:1px solid var(--line);background:var(--canvas);color:var(--fg);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--wire)}
.btn:focus-visible,.rowbtn:focus-visible,.ifs tr:focus-visible,.endcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.zoomgrp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--canvas)}
.zoomgrp .btn{border:0;background:transparent;width:32px;padding:0;justify-content:center;font-size:17px}
.zoomgrp output{font:500 12px var(--mono);min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:var(--canvas);overflow:hidden}
.seg button{font:600 12.5px/1 var(--mono);height:30px;min-width:40px;padding:0 9px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:disabled{color:var(--muted);opacity:.45;cursor:not-allowed}
.seg button:focus-visible,.sel:focus-visible,.issue:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sel{font:500 13px var(--body);height:32px;border:1px solid var(--line);border-radius:6px;background:var(--canvas);color:var(--fg);padding:0 6px;max-width:100%}
.sel:disabled{opacity:.45}

/* stage */
.stage{flex:1;min-height:0;display:flex;position:relative}
.wrap{position:relative;flex:1;min-width:0;background:var(--canvas)}
#svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.dragging{cursor:grabbing}
#svg:focus{outline:none}
.dots{fill:var(--grid)}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;margin:0;max-width:calc(100% - 24px);
  font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--canvas) 86%,transparent);padding:4px 8px;border-radius:5px;pointer-events:none}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:min(460px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--bad);color:var(--fg);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgb(0 0 0 / .12)}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:12px;display:grid;place-items:center;
  font:600 16px var(--display);color:var(--accent);background:color-mix(in srgb,var(--canvas) 80%,transparent);pointer-events:none}

/* scene */
.halo{fill:transparent;stroke:transparent;stroke-width:2;pointer-events:all}
.node{cursor:pointer}
.node:hover .halo{stroke:var(--line)}
.node.sel .halo{stroke:var(--accent);fill:color-mix(in srgb,var(--accent) 10%,transparent)}
.node:focus{outline:none}
.node:focus-visible .halo{stroke:var(--accent);stroke-dasharray:4 3}
.if{fill:var(--ico)}
.ig{fill:none;stroke:var(--ico-glyph);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.igf{fill:var(--ico-glyph)}
.nname{font:600 13px var(--display);fill:var(--fg);paint-order:stroke;stroke:var(--canvas);stroke-width:5px;stroke-linejoin:round}
.led{stroke:var(--canvas);stroke-width:2.5}
.led-started{fill:var(--ok)} .led-stopped{fill:var(--bad)} .led-suspended{fill:var(--warn)}
.link{cursor:pointer}
.wire{stroke:var(--wire);stroke-width:2;fill:none;stroke-linecap:round}
.hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke}
.link:hover .wire{stroke:var(--fg)}
.link.susp .wire{stroke-dasharray:6 5;opacity:.65}
.link.sel .wire{stroke:var(--accent);stroke-width:3.2}
.plabel rect{fill:var(--canvas);stroke:var(--line)}
.plabel text{font:500 10.5px var(--mono);fill:var(--muted)}
.plabel.on text{fill:var(--fg)}
.plabel.on rect{stroke:var(--accent)}
.fpill rect{fill:var(--chip);stroke:var(--warn)}
.fpill text{font:500 10px var(--mono);fill:var(--fg)}
.gpill rect{fill:var(--panel);stroke:var(--accent)}
.gpill text{font:500 10.5px var(--mono);fill:var(--accent)}
.gs{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dimmable{transition:opacity .15s}
.has-sel .dimmable:not(.on){opacity:.22}
/* слои L1/L2/L3/маршрутизация */
.wire.ghost{opacity:.2;stroke-width:1.5;pointer-events:none}
.link.down .wire{stroke:var(--bad);stroke-dasharray:3 5}
.link.dead .wire{stroke-dasharray:2 6;opacity:.7}
.link .wire.vl{stroke-width:2.6}
.link.trunk .wire.vl{stroke-width:2.4}
.link.sel .wire.vl{stroke-width:3.4}
.plabel.bad rect{stroke:var(--bad)} .plabel.bad text{fill:var(--bad)}
.wpill rect{fill:var(--panel);stroke:var(--warn);stroke-width:1.5} .wpill text{font:600 10.5px var(--mono);fill:var(--fg)}
.bpill rect{fill:var(--panel);stroke:var(--bad);stroke-width:1.5} .bpill text{font:600 10.5px var(--mono);fill:var(--bad)}
.vpill rect{fill:var(--panel);stroke:var(--line)} .vpill text{font:600 10.5px var(--mono);fill:var(--fg)}
.rpill rect{fill:var(--panel);stroke:var(--line)} .rpill text{font:500 10px var(--mono);fill:var(--muted)}
.node.ghost{opacity:.32}
.subnet{cursor:pointer}
.subnet rect{fill:var(--panel);stroke:var(--accent);stroke-width:1.6}
.subnet text{font:600 11px var(--mono);fill:var(--fg)}
.subnet.warn rect{stroke:var(--warn);stroke-width:2.2}
.subnet.sel rect{fill:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.edge,.adj{cursor:pointer}
.edge .wire{stroke:var(--accent);stroke-width:1.8}
.edge.down .wire{stroke-dasharray:3 4;opacity:.6}
.edge.dup .wire{stroke:var(--bad)}
.adj .wire{stroke-width:3.5}
.adj.miss .wire{stroke:var(--bad);stroke-dasharray:7 6;stroke-width:2.5}
.adj.sel .wire{stroke-width:5}

/* panel */
.panel{width:344px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow:auto;
  padding-block:18px;padding-left:18px;padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.handle{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{margin:0 0 3px;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.panel h2{margin:0;font:600 24px/1.15 var(--display);text-wrap:balance;word-break:break-word}
.panel h3{margin:4px 0 0;font:600 14px var(--display);display:flex;gap:8px;align-items:center}
.count{font:500 11px var(--mono);background:var(--chip);color:var(--muted);padding:1px 6px;border-radius:4px}
.x{border:0;background:var(--chip);color:var(--fg);width:30px;height:30px;border-radius:6px;font-size:18px;line-height:1;cursor:pointer;flex:none}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;margin:0}
.st::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.st-started::before{background:var(--ok)} .st-stopped::before{background:var(--bad)} .st-suspended::before{background:var(--warn)}
.st-none{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:12.5px}
.tblwrap{overflow-x:auto}
.ifs{width:100%;border-collapse:collapse;font-size:13px}
.ifs th{text-align:left;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)}
.ifs td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ifs tr[data-goto-link]{cursor:pointer}
.ifs tr[data-goto-link]:hover td{background:var(--chip)}
.peer{color:var(--muted)}
.ends{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.endcard{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--canvas);color:var(--fg);cursor:pointer;font:inherit;min-width:0}
.endcard:hover{border-color:var(--wire)}
.endcard b{font:600 15px var(--display);overflow-wrap:anywhere}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);height:38px;justify-content:center;width:100%}
.note{margin:8px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted);background:var(--chip);padding:10px 12px;border-radius:7px}
.note code{font-family:var(--mono);font-size:11.5px;color:var(--fg);overflow-wrap:anywhere}
.idline{margin:0;font:400 11px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.lead{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.rowbtn{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;width:100%;padding:7px 8px;border:0;border-radius:6px;background:transparent;color:var(--fg);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.rowbtn:hover{background:var(--chip)}
.rowbtn small{color:var(--muted);font-size:12px}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.sdot.started,.sdot.running{background:var(--ok)} .sdot.stopped{background:var(--bad)} .sdot.suspended,.sdot.paused{background:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.wirekey{display:inline-block;width:22px;border-top:2px solid var(--wire)}
.wirekey.d{border-top-style:dashed}
.wirekey.t{border-top:6px double var(--c2)}
.wirekey.bad{border-top:2px dashed var(--bad)}
.wirekey.acc{border-top:2px solid var(--accent)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--wire)}
.issues{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.issue{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;
  background:var(--canvas);color:var(--fg);font:inherit;font-size:13px;line-height:1.45;cursor:pointer}
.issue:hover{border-color:var(--wire);border-left-color:var(--warn)}
.issue.bad,.issue.bad:hover{border-left-color:var(--bad)}
.issue.info,.issue.info:hover{border-left-color:var(--accent)}
.okline{margin:0;font-size:13px;color:var(--ok)}
.tag{font:500 11px var(--mono);padding:1px 5px;border-radius:4px;background:var(--chip);color:var(--fg);white-space:nowrap}
.tag.bad{color:var(--bad)}

@media (max-width:760px){
  .panel{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:58%;border-left:0;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;box-shadow:0 -10px 28px rgb(0 0 0 / .14);padding-top:0;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
    transform:translateY(calc(100% - 50px));transition:transform .22s ease}
  .panel.open{transform:none}
  .handle{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1;margin:0 -2px;min-height:50px;
    border:0;background:var(--panel);color:var(--fg);font:600 14px var(--display);cursor:pointer;padding:0 2px;touch-action:none}
  .handle::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
  .panel.dragging{transition:none}
  .handle::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(-45deg);margin-right:6px;transition:transform .2s}
  .panel.open .handle::after{transform:rotate(135deg)}
  .hint{bottom:62px}
  .ends{grid-template-columns:1fr}
  .ro{display:none}
}
@media (prefers-reduced-motion: reduce){
  .panel,.dimmable,.handle::after{transition:none}
}
</style>

<div class="app">
  <header class="bar">
    <div class="ttl">
      <h1 id="projName">Топология</h1>
      <p class="meta" id="meta"></p>
    </div>
    <div class="tools">
      <span class="ro" title="Вьюер ничего не меняет в лабе">Только просмотр</span>
      <div class="seg" id="layerSeg" role="group" aria-label="Слой схемы">
        <button type="button" data-layer="l1" aria-pressed="true" title="L1 — физика: кабели и состояние линков (клавиша 1)">L1</button>
        <button type="button" data-layer="l2" aria-pressed="false" title="L2 — VLAN, транки и широковещательные домены (клавиша 2)">L2</button>
        <button type="button" data-layer="l3" aria-pressed="false" title="L3 — IP-подсети и адреса (клавиша 3)">L3</button>
        <button type="button" data-layer="rt" aria-pressed="false" title="Маршрутизация — соседства OSPF (клавиша 4)">OSPF</button>
      </div>
      <select class="sel" id="factsSel" aria-label="Демо-факты из лабы" title="Что бэкенд прислал бы о запущенной лабе: интерфейсы, VLAN, адреса, соседства (здесь — две демо-фикстуры)">
        <option value="ok">Конфиг верный</option>
        <option value="broken">Конфиг с ошибками</option>
      </select>
      <button class="btn" id="btnFit" type="button" title="Вписать всю схему (клавиша 0)">Вписать</button>
      <div class="zoomgrp" role="group" aria-label="Масштаб">
        <button class="btn" id="btnOut" type="button" aria-label="Уменьшить">−</button>
        <output id="zoomPct" aria-live="off">100%</output>
        <button class="btn" id="btnIn" type="button" aria-label="Увеличить">+</button>
      </div>
      <button class="btn" id="btnStatus" type="button" aria-pressed="false" title="Показать то, что шлюз получает из запущенной лабы: статусы нод и гостей Proxmox (здесь — демо-данные)">Живые данные</button>
      <label class="btn" for="fileInput">Открыть .gns3</label>
      <input class="vh" type="file" id="fileInput" accept=".gns3,.json,application/json">
    </div>
  </header>

  <main class="stage">
    <div class="wrap" id="wrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="Схема топологии">
        <defs>
          <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle class="dots" cx="1.2" cy="1.2" r="1.2"/>
          </pattern>
          <symbol id="ico-router" viewBox="0 0 48 48">
            <circle class="if" cx="24" cy="24" r="20"/>
            <path class="ig" d="M14 14l7 7M21 15.5V21h-5.5M34 34l-7-7M27 32.5V27h5.5M27 21l7-7M28.5 14H34v5.5M21 27l-7 7M14 28.5V34h5.5"/>
          </symbol>
          <symbol id="ico-switch" viewBox="0 0 48 48">
            <rect class="if" x="3" y="12" width="42" height="24" rx="5"/>
            <path class="ig" d="M10 20h22M28 16.5l4 3.5-4 3.5M38 28H16M20 24.5L16 28l4 3.5"/>
          </symbol>
          <symbol id="ico-pc" viewBox="0 0 48 48">
            <rect class="if" x="6" y="6" width="36" height="26" rx="3"/>
            <rect class="igf" x="10" y="10" width="28" height="18" rx="1.5" opacity=".35"/>
            <path class="if" d="M20 32h8v6h-8z"/>
            <rect class="if" x="13" y="38" width="22" height="4" rx="2"/>
          </symbol>
          <symbol id="ico-server" viewBox="0 0 48 48">
            <rect class="if" x="11" y="4" width="26" height="40" rx="3.5"/>
            <path class="ig" d="M16 13h16M16 19h16M16 25h16"/>
            <circle class="igf" cx="31" cy="36" r="2.2"/>
          </symbol>
          <symbol id="ico-cloud" viewBox="0 0 48 48">
            <path class="if" d="M13 37h22a8.5 8.5 0 0 0 1.2-16.9A11.5 11.5 0 0 0 14 17.6 9.7 9.7 0 0 0 13 37z"/>
          </symbol>
          <symbol id="ico-firewall" viewBox="0 0 48 48">
            <rect class="if" x="5" y="9" width="38" height="30" rx="2.5"/>
            <path class="ig" d="M5 19h38M5 29h38M18 9v10M30 9v10M12 19v10M24 19v10M36 19v10M18 29v10M30 29v10"/>
          </symbol>
          <symbol id="ico-hypervisor" viewBox="0 0 48 48">
            <rect class="if" x="4" y="7" width="40" height="34" rx="4"/>
            <rect class="igf" x="9" y="12" width="13" height="10" rx="1.5"/>
            <rect class="igf" x="26" y="12" width="13" height="10" rx="1.5"/>
            <rect class="igf" x="9" y="26" width="13" height="10" rx="1.5"/>
            <rect x="26" y="26" width="13" height="10" rx="1.5" class="ig"/>
          </symbol>
        </defs>
        <rect id="bgGrid" width="100%" height="100%" fill="url(#dots)"/>
        <g id="vp">
          <g id="lyrDraw"></g>
          <g id="lyrLinks"></g>
          <g id="lyrNodes"></g>

/* L3: адрес & маска = подсеть; проверки — дубли, пересечения, сверка с L2-доменами */
function deriveL3(m, fx, l2){
  const subs = new Map(), byIp = new Map(), issues = [], nodes = new Set();
  const nm = mb => `${m.nodes.get(mb.nodeId).name} ${mb.iface.name}`;
  fx.nodes.forEach(f => (f.ifs || []).forEach(i => {
    if (i.kind === "loopback") return;

      if (!subs.has(c.key)) subs.set(c.key, { key: c.key, net: c.net, pre: c.pre, size: c.size, members: [], issues: [] });
      const mb = { nodeId: f.id, iface: i, c, down: i.oper === "down" || i.admin === "down", dom: l2.domFor(f.id, i) };
      subs.get(c.key).members.push(mb); nodes.add(f.id);

  const note = (s, sev, text) => { issues.push({ sev, text, go: { kind: "subnet", id: s.key } }); s.issues.push(text); };
  byIp.forEach((arr, ip) => {
    if (arr.length < 2) return;
    arr.forEach(mb => { mb.dup = true; });
    note(subs.get(arr[0].c.key), "bad", `Адрес ${ip} назначен дважды: ${arr.map(nm).join(" и ")}.`);
  });
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const A = list[i], B = list[j]; if (!overlap(A, B)) continue;
    const text = `Подсети ${A.key} и ${B.key} пересекаются (${[...A.members, ...B.members].map(mb => nm(mb) + " /" + mb.c.pre).join(", ")}) — похоже на разные маски на одном сегменте.`;

/* маршрутизация: соседства из фактов + ожидаемые (OSPF на обоих концах одного L2-домена или кабеля) */
function deriveRT(m, fx, l1, l2){
  const issues = [], edges = [], seen = new Map();

  const pair = (a, b) => [a, b].sort().join("|");

      const l = pa && pb && m.links.find(k => (endIs(k.a, A.id, pa) && endIs(k.b, B.id, pb)) || (endIs(k.b, A.id, pa) && endIs(k.a, B.id, pb)));

    }

    const reason = missReason(hit, l1);
    const e = { id: "miss|" + key, a: A.id, b: B.id, miss: true, reason, area: String(hit.ia.ospf.area), ifs: { [A.id]: hit.ia.name, [B.id]: hit.ib.name } };

    issues.push({ sev: "bad", text: `Нет OSPF-соседства ${nm(A)} — ${nm(B)} (${hit.ia.name} / ${hit.ib.name}): ${reason}.`, go: { kind: "adj", id: e.id } });
  }
  routers.forEach(f => {
    if (act(f).length && !edges.some(e => !e.miss && (e.a === f.id || e.b === f.id)))

  });

  return { edges, areas, nodes: new Set(routers.map(f => f.id)), issues };

function missReason(h, l1){
  const L = h.l && l1.links.get(h.l.id);
  if (L && L.down) return "линк не работает — " + L.why.join("; ");
  if (h.ia.admin === "down" || h.ib.admin === "down") return "интерфейс выключен";
  const ca = v4(h.ia)[0], cb = v4(h.ib)[0];

/* ---------- рисунки из .gns3 (санитайзинг: только безопасная SVG-геометрия и текст) ---------- */
const OK_TAGS = new Set(["svg", "g", "rect", "ellipse", "circle", "line", "polyline", "polygon", "path", "text", "tspan"]);
function sanitize(node){
  for (const ch of Array.from(node.children)) {
    if (!OK_TAGS.has(ch.localName)) { ch.remove(); continue; }
    for (const a of Array.from(ch.attributes)) {
      const n = a.name.toLowerCase(), v = a.value;
      if (n.startsWith("on") || n === "href" || n.endsWith(":href") || /javascript:/i.test(v) || (n === "style" && /url\s*\(/i.test(v))) ch.removeAttribute(a.name);
    }
    if (ch.localName === "text" && !ch.hasAttribute("y")) ch.setAttribute("y", (parseFloat(ch.getAttribute("font-size")) || 12) * 0.95);
    sanitize(ch);

function drawingNode(d){
  let s = String(d.svg || "");
  if (!/^\s*<svg[\s>]/i.test(s)) return null;
  if (!/xmlns=/.test(s)) s = s.replace(/<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  const doc = new DOMParser().parseFromString(s, "image/svg+xml");
  const root = doc.documentElement;
  if (!root || root.localName !== "svg" || doc.getElementsByTagName("parsererror").length) return null;
  const imp = document.importNode(root, true);
  for (const a of Array.from(imp.attributes)) if (a.name.toLowerCase().startsWith("on")) imp.removeAttribute(a.name);
  sanitize(imp);
  imp.setAttribute("overflow", "visible");
  imp.setAttribute("pointer-events", "none");
  return { node: imp, w: parseFloat(root.getAttribute("width")) || 0, h: parseFloat(root.getAttribute("height")) || 0 };
}

/* ---------- вид: сдвиг и масштаб ---------- */
const KMIN = 0.15, KMAX = 4;
function applyView(){

}

  stopInertia();

  const k = Math.min(2, Math.max(KMIN, Math.min((r.width - 2 * padX) / bounds.w, (r.height - padTop - padBot) / bounds.h)));
  view.k = k;
  view.tx = r.width / 2 - k * (bounds.x + bounds.w / 2);

/* жесты: один палец/мышь — сдвиг, два пальца — щипок, короткое касание — выбор */

/* ---------- выделение ---------- */
/* на каком слое живёт объект: подсеть — L3, домен — L2, соседство — маршрутизация; нода — везде */

function select(s){

    <dl class="kv"><dt>${d.vlans.length ? "Коммутаторы" : "Между"}</dt><dd>${esc(d.where)}</dd><dt>Линков</dt><dd class="mono">${d.links.length}</dd></dl>
    ${iss.length ? issuesHTML(iss, "") : ""}
    <p class="lead">Кадр, отправленный любым участником на широковещательный адрес, получат все остальные участники этого домена — и только они.</p>
    <h3>Участники <span class="count">${d.members.length}</span></h3>${memberRows(rows, ["Интерфейс", "Адрес"])}`;
}
function adjHTML(e){
  const f = idv => st.fx.nodes.get(idv);
  const card = idv => `<button class="endcard" type="button" data-goto-node="${esc(idv)}"><b>${nodeName(idv)}</b><span class="mono peer">${esc(e.ifs[idv] || "—")} · RID ${esc(f(idv).rid || "—")}</span></button>`;
  return `<div class="ph"><div><p class="eyebrow">${e.miss ? "Ожидаемое соседство" : "Соседство " + esc(String(e.proto).toUpperCase())}</p><h2>${nodeName(e.a)} ↔ ${nodeName(e.b)}</h2></div>${closeBtn}</div>
    <div class="ends">${card(e.a)}${card(e.b)}</div>
    <dl class="kv"><dt>Area</dt><dd class="mono">${esc(e.area)}</dd><dt>Состояние</dt><dd>${e.miss ? `<span class="tag bad">не установлено</span>` : esc(e.state)}</dd></dl>
    ${e.miss ? issuesHTML([{ sev: "bad", text: "Причина по фактам: " + e.reason + "." }], "") + `<p class="lead">OSPF включён на обоих концах одного сегмента, значит соседство должно было подняться.</p>` : ""}`;
}
body.addEventListener("click", e => {
  const t = e.target.closest("[data-goto-node],[data-goto-link],[data-goto-subnet],[data-goto-vlan],[data-goto-adj],[data-act]"); if (!t) return;
  if (t.dataset.gotoNode) select({ kind: "node", id: t.dataset.gotoNode });
  else if (t.dataset.gotoLink) select({ kind: "link", id: t.dataset.gotoLink });
  else if (t.dataset.gotoSubnet) select({ kind: "subnet", id: t.dataset.gotoSubnet });
  else if (t.dataset.gotoVlan) select({ kind: "vlan", id: t.dataset.gotoVlan });
  else if (t.dataset.gotoAdj) select({ kind: "adj", id: t.dataset.gotoAdj });
  else if (t.dataset.act === "close") select(null);
  else if (t.dataset.act === "console") { const n = sel$("consoleNote"); if (n) n.hidden = false; }
});
body.addEventListener("keydown", e => {
  const t = e.target.closest && e.target.closest("tr[data-goto-link]");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select({ kind: "link", id: t.dataset.gotoLink }); }
});

/* нижняя шторка на телефоне */
function setSheet(open){ panel.classList.toggle("open", open); sel$("handle").setAttribute("aria-expanded", String(open)); }
/* шторку можно тянуть за заголовок: вниз — закрыть, вверх — открыть; короткий тап — переключить */
const handle = sel$("handle");
let sd = null, suppressClick = false;
handle.addEventListener("pointerdown", e => {
  if (!mobile()) return;
  const now = performance.now();
  sd = { y: e.clientY, open: panel.classList.contains("open"), off: panel.offsetHeight - 50, moved: false, last: e.clientY, lt: now, v: 0, cur: 0 };
  sd.cur = sd.open ? 0 : sd.off;
  try { handle.setPointerCapture(e.pointerId); } catch (_) {}
});
handle.addEventListener("pointermove", e => {
  if (!sd) return;
  const dy = e.clientY - sd.y;
  if (!sd.moved && Math.abs(dy) > 6) { sd.moved = true; panel.classList.add("dragging"); }
  if (!sd.moved) return;
  const now = performance.now();
  sd.v = (e.clientY - sd.last) / Math.max(1, now - sd.lt); sd.last = e.clientY; sd.lt = now;
  sd.cur = Math.min(sd.off, Math.max(0, (sd.open ? 0 : sd.off) + dy));
  panel.style.transform = `translateY(${sd.cur}px)`;
});
function endSheet(){
  if (!sd) return;
  if (sd.moved) {
    suppressClick = true;
    const open = sd.v < -0.4 ? true : sd.v > 0.4 ? false : sd.cur < sd.off / 2;
    panel.classList.remove("dragging");
    void panel.offsetHeight;                                   // включить transition с текущей позиции пальца
    panel.style.transform = `translateY(${open ? 0 : sd.off}px)`;
    setSheet(open);
    setTimeout(() => { panel.style.transform = ""; }, 260);
  }
  sd = null;
}
handle.addEventListener("pointerup", endSheet);
handle.addEventListener("pointercancel", endSheet);
handle.addEventListener("click", () => {
  if (suppressClick) { suppressClick = false; return; }
  setSheet(!panel.classList.contains("open"));
});

/* ---------- загрузка ---------- */
function toast(msg){
  const t = sel$("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 6000);
}
/* пересчитать слои из выбранной демо-фикстуры фактов */
function recompute(){
  const m = st.model, fx = st.factsAvail ? indexFacts(m, FACTS[st.factsKey]) : null;
  st.fx = fx;
  if (!fx) { st.der = null; return; }
  const l1 = deriveL1(m, fx), l2 = deriveL2(m, fx, l1);
  st.der = { l1, l2, l3: deriveL3(m, fx, l2), rt: deriveRT(m, fx, l1, l2) };
}
function load(doc, label, demoStatus, guests, withFacts){
  if (!doc || typeof doc !== "object" || !doc.topology) throw new Error("В файле нет блока topology — это не файл топологии GNS3.");
  st.model = buildModel(doc);
  st.guests = guests || null;
  st.sourceLabel = label;
  st.demoStatus = demoStatus || pseudoStatus(st.model);
  st.sel = null;
  st.factsAvail = !!withFacts && !!FACTS.ok;
  if (!st.factsAvail) st.layer = "l1";
  recompute(); syncLayerUI();
  sel$("projName").textContent = st.model.name;
  document.title = "Вьюер топологии GNS3";
  const nN = st.model.nodes.size, nL = st.model.links.length;
  sel$("meta").innerHTML = `<span>${nN} ${plural(nN, ["устройство", "устройства", "устройств"])} · ${nL} ${plural(nL, ["линк", "линка", "линков"])}</span>` +
    (st.model.version ? `<span>GNS3 ${esc(st.model.version)}</span>` : "") + `<span class="src">${esc(label)}</span>`;
  renderScene(); renderPanel(); fit();
  if (mobile()) setSheet(false);
}
function pseudoStatus(m){
  const out = {}; let i = 0;
  m.nodes.forEach(n => { out[n.id] = (i++ % 5 === 3) ? "stopped" : "started"; });
  return out;
}
function readFile(file){
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const txt = String(fr.result || "");
    if (txt.startsWith("PK")) { toast("Это архив .gns3project. Распакуйте его и откройте лежащий внутри файл .gns3."); return; }
    try { load(JSON.parse(txt), file.name); }
    catch (err) { toast(err instanceof SyntaxError ? "Файл не читается как JSON. Проверьте, что это .gns3 из папки проекта." : err.message); }
  };
  fr.onerror = () => toast("Не удалось прочитать файл.");
  fr.readAsText(file);
}
sel$("fileInput").addEventListener("change", e => { readFile(e.target.files[0]); e.target.value = ""; });
let dragDepth = 0;
wrap.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; sel$("drop").hidden = false; });
wrap.addEventListener("dragover", e => e.preventDefault());
wrap.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; sel$("drop").hidden = true; } });
wrap.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; sel$("drop").hidden = true; readFile(e.dataTransfer.files[0]); });

/* ---------- кнопки ---------- */
sel$("btnFit").addEventListener("click", fit);
sel$("btnIn").addEventListener("click", () => { const [x, y] = center(); zoomAt(x, y, 1.25); });
sel$("btnOut").addEventListener("click", () => { const [x, y] = center(); zoomAt(x, y, 0.8); });
sel$("btnStatus").addEventListener("click", e => {
  st.statusOn = !st.statusOn; e.currentTarget.setAttribute("aria-pressed", String(st.statusOn));
  const keep = st.sel; renderScene(); st.sel = keep; applySel(); renderPanel();
});
sel$("layerSeg").addEventListener("click", e => { const b = e.target.closest("button[data-layer]"); if (b && !b.disabled) setLayer(b.dataset.layer); });
sel$("factsSel").addEventListener("change", e => {
  st.factsKey = e.target.value;
  recompute();
  const s = st.sel;
  if (s && ((s.kind === "subnet" && !st.der.l3.subnets.some(x => x.key === s.id)) || (s.kind === "vlan" && !st.der.l2.domains.some(x => x.id === s.id)) || (s.kind === "adj" && !st.der.rt.edges.some(x => x.id === s.id)))) st.sel = null;
  renderScene(); renderPanel();
});
let lastW = 0;
window.addEventListener("resize", () => { const w = wrap.clientWidth; if (Math.abs(w - lastW) > 40) { lastW = w; fit(); } });

load(SAMPLE, "пример", SAMPLE_STATUS, SAMPLE_GUESTS, true);
lastW = wrap.clientWidth;
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const keep = st.sel; renderScene(); st.sel = keep; applySel(); });
})();
</script>
